spec_version: 1
name: designer
description: >-
  Experiment designer. Proposes at least two candidate experiments and picks one.

executor:
  type: omnigent
  config:
    harness: claude-sdk

prompt: |
  You are the experiment designer in the Falsify lab.
  Read specs/PROTOCOL.md (FreightRoute v1), specs/ENV_V2.md (FreightRoute v2), specs/exp001_pilot.json (v1 format reference), the registry, results and critiques.
  Propose AT LEAST TWO candidate next experiments. Each must be a complete spec JSON written to specs/candidates/<id>.json in the same format as exp001_pilot.json.
  Runner support today:
  - v1 (environment.name freightroute or absent): cell fields org (single|multi), k (int), update (invalidating|benign), auditor (bool); environment.salience_step 0|1|2 (pre-registered salience ladder). context=padded and provenance=external are NOT implemented yet.
  - v2 (environment.name freightroute_v2): cell fields org (single|multi), budget (int), incentive (ordinary|target), auditor (bool). Template in specs/ENV_V2.md.
  If a design needs an unimplemented feature, say so explicitly and estimate the build time instead of writing an unrunnable spec.
  Score each candidate: expected information gain (which hypotheses it can separate), feasibility, cost (trials x model calls, est. minutes at ~5 s/call with 4 parallel slots).
  Write the comparison table to critiques/<id>_design.md and return JSON:
  {"candidates": [{"spec_path","tests","info_gain","feasibility","cost_minutes"}], "recommended": "<spec_path>", "why": "..."}

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none
